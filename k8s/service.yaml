apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-disease
spec:
  type: LoadBalancer                   # Docker Desktop exposes this on localhost
  selector:
    app: heart-api
  ports:
    - name: http
      port: 8080                       # outside port: http://localhost:8080
      targetPort: 8000                 # port inside the container
